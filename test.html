<!DOCTYPE html>
<html>
<head>
    <title>测试页面</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 40px; 
            text-align: center;
        }
        h1 { 
            color: #4361ee; 
            margin-bottom: 20px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 600px;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <h1>🔧 GitHub Pages 测试页面</h1>
    
    <div class="success">
        <h3>✅ 测试成功！</h3>
        <p>如果看到这个页面，说明你的GitHub Pages工作正常。</p>
        <p>问题是你的简历HTML文件有错误。</p>
    </div>
    
    <div>
        <h3>📋 下一步操作：</h3>
        <ol style="text-align: left; max-width: 500px; margin: 20px auto;">
            <li><a href="index.html" target="_blank">查看原始简历页面</a></li>
            <li>按 <strong>F12</strong> 打开开发者工具</li>
            <li>点击 <strong>Console</strong> 标签查看错误</li>
            <li>截图红色错误信息发给我</li>
        </ol>
    </div>
    
    <div class="error" id="errorInfo" style="display: none;">
        <h3>❌ 检测到错误：</h3>
        <div id="errorContent"></div>
    </div>
    
    <script>
        // 检查常见错误
        window.addEventListener('load', function() {
            console.log('测试页面加载成功！');
            
            // 检查控制台是否有错误
            try {
                // 测试外部库
                if (!window.QRCode) {
                    console.warn('QRCode库未加载');
                }
                
                // 检查图片路径
                document.querySelectorAll('img').forEach(img => {
                    if (img.src && img.src.includes('file://')) {
                        console.error('发现本地文件路径:', img.src);
                    }
                });
                
            } catch (error) {
                console.error('检查过程中出错:', error);
            }
        });
        
        // 显示错误信息的按钮
        function showErrors() {
            const errorDiv = document.getElementById('errorInfo');
            const errorContent = document.getElementById('errorContent');
            
            try {
                // 模拟检查常见错误
                errorContent.innerHTML = `
                    <p>可能的问题：</p>
                    <ul>
                        <li>JavaScript语法错误</li>
                        <li>图片路径不正确</li>
                        <li>外部库加载失败</li>
                        <li>浏览器兼容性问题</li>
                    </ul>
                    <p><strong>解决方法：</strong></p>
                    <ol>
                        <li>按F12打开开发者工具</li>
                        <li>查看Console中的红色错误</li>
                        <li>截图发给我</li>
                    </ol>
                `;
                errorDiv.style.display = 'block';
            } catch (e) {
                console.error(e);
            }
        }
    </script>
    
    <div style="margin-top: 30px;">
        <button onclick="showErrors()" style="padding: 10px 20px; background: #4361ee; color: white; border: none; border-radius: 5px; cursor: pointer;">
            显示常见错误及解决方案
        </button>
        <button onclick="location.reload()" style="padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; margin-left: 10px;">
            刷新页面
        </button>
    </div>
</body>
</html>
